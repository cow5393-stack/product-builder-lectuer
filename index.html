<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Pro - 스마트 로또 번호 생성기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">Lotto Pro</div>
            <div class="controls">
                <button id="lang-toggle" class="lang-toggle">EN</button>
                <button id="theme-toggle" class="theme-toggle">☀️</button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="generator-section">
            <h1 id="main-title">스마트 로또 번호 생성기</h1>
            <p id="sub-title" class="sub-title">당신의 행운이 클릭 한 번으로 시작됩니다.</p>
            
            <div id="lotto-numbers" class="lotto-numbers">
                <!-- Lotto balls will be injected here -->
            </div>

            <div class="action-area">
                <button id="generate-button" class="generate-button">번호 생성하기</button>
                <div id="lucky-quote" class="lucky-quote"></div>
                
                <div id="luck-gauge-container" class="luck-gauge-container hidden">
                    <div id="gauge-label" class="gauge-label">오늘의 행운 지수:</div>
                    <div class="gauge-bar">
                        <div id="gauge-fill" class="gauge-fill"></div>
                    </div>
                    <div id="fortune-details" class="fortune-details">
                        <!-- Detailed fortune will be injected here -->
                    </div>
                </div>
            </div>
        </section>

        <section class="content-section">
            <div class="content-card">
                <h2 id="tips-title">로또 당첨 팁</h2>
                <ul id="tips-list">
                    <!-- Tips will be injected here -->
                </ul>
            </div>
            <div class="content-card">
                <h2 id="about-title">왜 Lotto Pro인가요?</h2>
                <p id="about-text">우리는 진정한 무작위성을 보장하는 고품질 알고리즘을 통해 당신의 당첨 확률을 높이는 데 도움을 줍니다.</p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-links">
            <a href="#" id="privacy-link">개인정보처리방침</a>
            <a href="#" id="terms-link">이용약관</a>
        </div>
        <p>&copy; 2026 Lotto Pro. All rights reserved.</p>
    </footer>

    <script src="main.js"></script>
</body>
</html>
